<div class="icd-diagnosis-picker relative"
     data-search-url="{% url 'home:icd11_search_api' %}"
     data-validate-url="{% url 'home:icd11_validate_api' %}">
    <input
        type="text"
        class="icd-diagnosis-search w-full bg-white border-2 border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-slate-700 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all"
        placeholder="Search ICD-11 diagnosis (e.g. diabetes, hypertension, BA00)…"
        autocomplete="off"
        aria-label="Search ICD-11 diagnosis"
    >
    <div class="icd-diagnosis-results absolute z-50 left-0 right-0 bg-white border border-slate-200 rounded-xl shadow-xl mt-2 max-h-64 overflow-y-auto hidden"></div>
    <div class="icd-diagnosis-checking mt-3 hidden" aria-live="polite" aria-busy="true">
        <div class="flex items-center gap-3 p-3.5 bg-slate-50 border border-slate-200 rounded-xl">
            <div class="icd-diagnosis-spinner shrink-0" aria-hidden="true"></div>
            <div class="min-w-0">
                <div class="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-0.5">Checking with DHA</div>
                <div class="icd-diagnosis-checking-label text-sm font-bold text-slate-800 break-words">Validating terminology…</div>
                <div class="text-xs font-medium text-slate-500 mt-0.5">Please wait — contacting DHA terminology service</div>
            </div>
        </div>
    </div>
    <div class="icd-diagnosis-selected mt-3 hidden">
        <div class="flex items-start justify-between gap-3 p-3 bg-indigo-50 border border-indigo-100 rounded-xl">
            <div class="min-w-0">
                <div class="text-[10px] font-black uppercase tracking-widest text-indigo-500 mb-1">Selected diagnosis</div>
                <div class="icd-diagnosis-selected-label text-sm font-bold text-slate-900 break-words"></div>
                <div class="icd-diagnosis-selected-meta text-xs font-semibold text-slate-500 mt-1"></div>
            </div>
            <button type="button" class="icd-diagnosis-clear text-[10px] font-black uppercase tracking-wider text-slate-500 hover:text-rose-600 shrink-0">Clear</button>
        </div>
    </div>
    <div class="icd-diagnosis-validate-status text-[11px] font-semibold mt-2 ml-1 hidden"></div>
    <p class="icd-diagnosis-hint text-[11px] font-semibold text-slate-400 mt-2 ml-1">
        Search local ICD-11 · on select, cross-check with DHA terminology
    </p>
    <div class="hidden">{{ diagnosis_field }}</div>
</div>
<style>
.icd-diagnosis-spinner {
    width: 22px;
    height: 22px;
    border: 2.5px solid #e2e8f0;
    border-top-color: #4f46e5;
    border-radius: 50%;
    animation: icd-spin 0.7s linear infinite;
}
@keyframes icd-spin {
    to { transform: rotate(360deg); }
}
.icd-diagnosis-picker.is-validating .icd-diagnosis-search {
    opacity: 0.65;
    pointer-events: none;
}
.icd-diagnosis-picker.is-validating .icd-diagnosis-results {
    display: none !important;
}
.icd-diagnosis-picker.is-validating .icd-diagnosis-hint {
    display: none;
}
</style>
